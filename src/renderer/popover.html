<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>Train Menu</title>
    <link rel="stylesheet" href="tokens.css" />
    <style>
      /* Monochrome Lab. Tokens come from tokens.css - no hardcoded colours here
         except the WMATA line hues, which are agency data, not brand colour. */

      :root {
        /* --bg-stage as channels, so the ground can carry an alpha. The hex token
           stays the source of truth for everything that wants it flat. */
        --stage-rgb: 11, 11, 12;
      }
      /* The type knob. Every size on this surface is a rem off the root, so one
         declaration moves the whole board and nothing has to be told twice. 14 is
         the size the tokens were drawn at, and what tokens.css already resolves to
         (0.875rem of the 16px initial value), so the default renders identically to
         before the setting existed. */
      html {
        font-size: calc(var(--text-px, 14) * 1px);
        /* tokens.css paints the root with the flat stage colour, and the root's
           background is what becomes the window canvas - so an alpha on <body>
           was being composited over an opaque ground and the opacity setting did
           nothing. Exactly one element may paint the ground, and it is <body>. */
        background: transparent;
      }

      body {
        /* Painted here, not by the window, so the opacity setting can move it: the
           BrowserWindow is transparent with vibrancy behind it (see app.js), and the
           blur is what keeps this legible over a busy desktop. The inset ring stands
           in for the window edge, which a transparent window no longer draws. */
        background: rgba(var(--stage-rgb), var(--pop-alpha, 0.9));
        box-shadow: inset 0 0 0 1px var(--ink-800);
        border-radius: var(--radius-xl);
        overflow: hidden;
        user-select: none;
      }

      /* --- Head: mark + ASCII/SVG controls --- */
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-5);
        padding: var(--space-5) var(--space-6);
        border-bottom: 1px solid var(--line);
        -webkit-app-region: drag;
      }
      /* The trip, in the chrome. It is the one thing the list cannot say for itself,
         and it takes the place of the app's own name - nobody standing at Rosslyn
         needs told which app they just clicked. */
      .trip {
        font-size: var(--fs-xxs);
        letter-spacing: var(--tracking-caps);
        text-transform: uppercase;
        color: var(--ink-200);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .trip .sep {
        color: var(--signal);
      }
      .controls {
        display: flex;
        align-items: center;
        gap: var(--space-5);
        -webkit-app-region: no-drag;
      }
      .icon {
        display: grid;
        place-items: center;
        width: 20px;
        height: 20px;
        padding: 0;
        appearance: none;
        background: transparent;
        border: 0;
        border-radius: var(--radius-sm);
        color: var(--ink-400);
        cursor: pointer;
        transition: color var(--motion-base) var(--ease);
      }
      .icon:hover {
        color: var(--ink-100);
      }
      .icon svg {
        width: 14px;
        height: 14px;
        stroke: currentColor;
        stroke-width: 1.6;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      main {
        padding: var(--space-6);
      }

      /* --- The departure list ---
         One column of minutes, soonest first, live rows and timetable rows in the
         same list because that is the order you leave the house in. The stamp is
         the freshness proof: a frozen feed shows as an old clock rather than a
         countdown ticking over stale numbers. */
      /* First and only thing in the body now, so there is nothing above it to be
         divided from. */
      .feed {
        margin-top: 0;
      }
      .feedhead {
        display: flex;
        align-items: center;
        gap: var(--space-3);
        margin-bottom: var(--space-4);
        font-size: 0.625rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--ink-600);
      }
      .feedhead .live {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--signal);
        box-shadow: var(--signal-glow);
      }
      .feedhead .stamp {
        margin-left: auto;
        letter-spacing: 0.06em;
        font-variant-numeric: tabular-nums;
      }
      table.feedtable {
        width: 100%;
        border-collapse: collapse;
        font-variant-numeric: tabular-nums;
      }
      table.feedtable td {
        padding: var(--space-3) 0;
        border-bottom: 1px solid var(--ink-900);
        vertical-align: baseline;
        color: var(--ink-300);
      }
      table.feedtable tr:last-child td {
        border-bottom: 0;
      }
      /* The minute is the thing you read, so it is the only large number on the
         row and it is the leftmost column - one ragged-right scan down the list,
         no hunting across the width. */
      .feedtable .c-min {
        width: 5ch;
        font-size: var(--fs-lg);
        font-weight: var(--weight-light);
        letter-spacing: var(--tracking-value);
        color: var(--ink-100);
      }
      .feedtable .c-min .u {
        font-size: var(--fs-xxs);
        letter-spacing: 0;
        color: var(--ink-500);
      }
      .feedtable .c-dot {
        width: 14px;
      }
      /* .dot is sized as a flex item everywhere else on this surface; in a table
         cell it is an inline span, where width is ignored and it draws nothing. */
      .feedtable .c-dot .dot {
        display: inline-block;
      }
      .feedtable .c-ln {
        width: 4ch;
        font-size: var(--fs-xs);
        color: var(--ink-400);
      }
      /* One line, always. A wrapped terminus turns a scan into reading, and bigger
         type is exactly when it starts wrapping. */
      .feedtable .c-to {
        font-size: var(--fs-xs);
        color: var(--ink-200);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 0;
      }
      /* One right-hand column, one meaning, all the way down: when this train leaves
         the platform. No word ever takes its place - the verdicts have their own
         line, where they cost the clock nothing. */
      .feedtable .c-clock {
        width: 7ch;
        padding-left: var(--space-4);
        text-align: right;
        white-space: nowrap;
        font-size: var(--fs-xs);
        color: var(--ink-500);
      }
      /* What this train is to you, under the train it is about: "leave in Nm ·
         arrive ~HH:MM" on the one you are being sent for, "gone" on the one the walk
         has already taken. Only those two rows have anything to say, and being on
         the row means the verdict and its train cannot be read apart. */
      .feedtable tr.said td {
        padding-bottom: var(--space-1);
        border-bottom: 0;
      }
      .feedtable tr.answer td {
        padding-top: 0;
        font-size: 0.625rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--signal);
      }
      .feedtable tr.answer .tail {
        color: var(--ink-500);
      }
      /* A verdict about a train you cannot have is not a signal. Same line, same
         place, one step darker than the row it belongs to. */
      .feedtable tr.answer.past td {
        color: var(--ink-600);
      }
      /* The train you are being told to leave for: the brightest row on the board,
         every cell of it. Nothing else on the list is at full ink, so the eye lands
         here before it reads anything. */
      .feedtable tr.go .c-min,
      .feedtable tr.go .c-ln,
      .feedtable tr.go .c-to,
      .feedtable tr.go .c-clock {
        color: var(--ink-100);
      }
      .feedtable tr.go .dot {
        box-shadow: 0 0 6px currentColor;
      }
      /* Scheduled, not predicted: one step of ink back, and never the signal
         colour. The minute keeps its `~` - it is a published time, not a train
         anyone has seen. */
      .feedtable tr.sched .c-min {
        color: var(--ink-300);
      }
      /* Unreachable inside the walk. It keeps its true minute and its place in the
         order - dimmed, never dropped, never re-sorted. */
      .feedtable tr.missed .c-min,
      .feedtable tr.missed .c-to,
      .feedtable tr.missed .c-ln,
      .feedtable tr.missed .c-clock {
        color: var(--ink-600);
      }
      .feedtable tr.missed .dot {
        opacity: 0.35;
      }
      /* Another line off the same platform: real, and the answer to "is anything
         moving at all", but not a train that takes you where you asked. */
      .feedtable tr.other .c-min {
        font-size: var(--fs-sm);
        color: var(--ink-500);
      }
      .feedtable tr.other .c-to,
      .feedtable tr.other .c-ln,
      .feedtable tr.other .c-clock {
        color: var(--ink-500);
      }
      /* Why the list is empty, in the list rather than in an empty box. */
      .feedtable tr.quiet td {
        border-bottom: 0;
        font-size: var(--fs-xs);
        color: var(--ink-500);
      }
      /* The walk, named once, under the trains it applies to. */
      .feedfoot {
        display: flex;
        align-items: center;
        gap: var(--space-3);
        margin-top: var(--space-4);
        font-size: 0.625rem;
        letter-spacing: 0.06em;
        color: var(--ink-600);
      }

      /* --- Alerts ---
         Severity is deliberately flat: on live records DelaySeverity is null and
         PassengerDelay is 0, so a colour ladder would be invented, not reported. */
      .watch {
        display: flex;
        align-items: center;
        gap: var(--space-3);
        margin-top: var(--space-6);
        padding-top: var(--space-5);
        border-top: 1px solid var(--line-faint);
        font-size: 0.625rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--ink-600);
      }
      .watch .chips {
        display: flex;
        gap: var(--space-3);
      }
      .chip {
        padding: 2px var(--space-3);
        border: 1px solid var(--line);
        border-radius: var(--radius-xs);
        letter-spacing: 0.06em;
        color: var(--ink-400);
      }
      .when {
        margin-left: auto;
        letter-spacing: 0.06em;
        font-variant-numeric: tabular-nums;
      }
      .alert {
        margin-top: var(--space-4);
        padding: var(--space-5);
        border: 1px solid rgba(255, 216, 107, 0.22);
        border-left: 2px solid var(--signal-warn);
        border-radius: var(--radius-xs);
        background: rgba(255, 216, 107, 0.05);
      }
      .alert .top {
        display: flex;
        align-items: center;
        gap: var(--space-3);
        margin-bottom: var(--space-3);
        font-size: 0.625rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--ink-500);
      }
      .alert .top .adot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--signal-warn);
      }
      .alert .top .age {
        margin-left: auto;
        letter-spacing: 0.06em;
        color: var(--ink-600);
      }
      /* Descriptions run past 300 characters, so clamp on a line boundary and
         keep an expand affordance rather than cutting mid-fact. */
      .alert .body {
        font-size: var(--fs-xs);
        line-height: 1.5;
        color: var(--ink-300);
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .alert.open .body {
        -webkit-line-clamp: none;
      }
      .alert .more {
        display: inline-block;
        margin-top: var(--space-3);
        font-size: 0.625rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--ink-500);
        border-bottom: 1px solid var(--line);
        padding-bottom: 1px;
        cursor: pointer;
      }
      .clear {
        display: flex;
        align-items: center;
        gap: var(--space-4);
        margin-top: var(--space-4);
        font-size: var(--fs-xs);
        color: var(--ink-500);
      }
      .clear .ok {
        color: var(--signal);
      }
      .clear .when {
        font-size: 0.625rem;
        color: var(--ink-600);
      }

      /* --- Station picker rows (setup) --- */
      ul {
        list-style: none;
        margin: var(--space-6) 0 0;
        padding: 0;
        border-top: 1px dashed var(--line-faint);
      }
      li {
        display: flex;
        align-items: center;
        gap: var(--space-4);
        padding: var(--space-4) 0;
        border-bottom: 1px dashed var(--line-faint);
        font-size: var(--fs-sm);
      }
      li:last-child {
        border-bottom: 0;
      }
      .dot {
        flex: 0 0 auto;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--ink-600);
      }
      /* Real WMATA line colours - agency data. */
      .dot[data-color="red"] { background: #bf0d3e; }
      .dot[data-color="orange"] { background: #ed8b00; }
      .dot[data-color="blue"] { background: #009cde; }
      .dot[data-color="green"] { background: #00b140; }
      .dot[data-color="yellow"] { background: #ffd100; }
      .dot[data-color="silver"] { background: #919d9d; }
      .code {
        flex: 0 0 auto;
        width: 2ch;
        font-size: var(--fs-xxs);
        letter-spacing: 0.06em;
        color: var(--ink-500);
      }
      /* --- Empty / setup state --- */
      h1 {
        font-size: 1.75rem;
        font-weight: var(--weight-light);
        letter-spacing: var(--tracking-value);
        color: var(--ink-100);
      }
      .lede {
        margin-top: var(--space-4);
        font-size: var(--fs-sm);
        color: var(--ink-400);
      }
      form {
        margin-top: var(--space-7);
      }
      label {
        display: block;
        margin-bottom: var(--space-5);
      }
      .field {
        display: flex;
        align-items: center;
        gap: var(--space-4);
        margin-top: var(--space-3);
        padding: var(--space-4) var(--space-5);
        background: transparent;
        border: 1px solid var(--line);
        border-radius: var(--radius-md);
        transition: border-color var(--motion-base) var(--ease);
      }
      .field:hover,
      .field:focus-within {
        border-color: var(--ink-600);
      }
      .field .prompt {
        color: var(--signal);
        font-size: var(--fs-sm);
      }
      input {
        flex: 1;
        min-width: 0;
        appearance: none;
        background: transparent;
        border: 0;
        padding: 0;
        font-family: var(--font-mono);
        font-size: var(--fs-sm);
        color: var(--ink-100);
        caret-color: var(--signal);
        user-select: text;
      }
      input:focus,
      input:focus-visible {
        outline: none;
        box-shadow: none;
      }
      input::placeholder {
        color: var(--ink-faint);
      }
      /* The stepper is macOS chrome on a surface that has none of it, and the
         field is three keystrokes wide anyway. */
      input[type="number"]::-webkit-inner-spin-button {
        appearance: none;
        margin: 0;
      }

      /* --- Brightness slider ---
         A 1px hairline track with a mint dot for a thumb and a 1px mint fill
         behind it: the same vocabulary as the rest of the surface, no new colour
         and no new shape. --fill is set by the renderer as the value changes. */
      input[type="range"] {
        flex: 1;
        min-width: 0;
        appearance: none;
        -webkit-appearance: none;
        height: 12px;
        background: transparent;
        cursor: pointer;
      }
      input[type="range"]::-webkit-slider-runnable-track {
        height: 1px;
        /* Two hard stops, so this is a mint fill up to the thumb and a hairline
           after it - not a gradient. */
        background: linear-gradient(
          to right,
          var(--signal) 0 var(--fill, 0%),
          var(--ink-700) var(--fill, 0%) 100%
        );
      }
      input[type="range"]::-webkit-slider-thumb {
        appearance: none;
        -webkit-appearance: none;
        width: 7px;
        height: 7px;
        margin-top: -3px;
        border: 0;
        border-radius: 50%;
        background: var(--signal);
        box-shadow: var(--signal-glow);
      }
      /* A one-line gloss under a field, for the setting whose off switch is a
         value rather than a control. */
      .sublabel {
        margin-top: var(--space-3);
        font-size: var(--fs-xxs);
        letter-spacing: var(--tracking-caps);
        text-transform: uppercase;
        color: var(--ink-600);
      }
      .field .unit,
      .field.range .unit {
        flex: 0 0 auto;
        width: 4ch;
        text-align: right;
        font-size: var(--fs-xxs);
        font-variant-numeric: tabular-nums;
        color: var(--ink-400);
      }

      /* --- Menu bar style picker ---
         Three rows rather than a segmented strip: each style needs a line of
         explanation, and the menu bar itself is the real preview. */
      .styles {
        margin-top: var(--space-3);
        display: grid;
        gap: var(--space-2);
      }
      .style {
        display: flex;
        align-items: baseline;
        gap: var(--space-4);
        width: 100%;
        padding: var(--space-3) var(--space-5);
        background: transparent;
        border: 1px solid var(--line);
        border-radius: var(--radius-md);
        text-align: left;
        color: var(--ink-400);
        cursor: pointer;
        transition:
          border-color var(--motion-base) var(--ease),
          color var(--motion-base) var(--ease);
      }
      .style:hover {
        border-color: var(--ink-600);
        color: var(--ink-100);
      }
      .style[aria-checked="true"] {
        border-color: var(--signal);
        background: var(--bg-pressed);
        color: var(--ink-100);
      }
      .style .name {
        flex: 0 0 auto;
        font-family: var(--font-mono);
        font-size: var(--fs-sm);
      }
      .style .note {
        flex: 1;
        min-width: 0;
        font-size: var(--fs-xxs);
        letter-spacing: var(--tracking-caps);
        text-transform: uppercase;
        color: var(--ink-600);
        text-align: right;
      }

      /* --- Station combobox ---
         The native datalist dropdown was the one surface on this popover that
         macOS drew, and it looked like it. These rows are ours: same tokens as
         everything else, and the line bullets come along for free. */
      .combo {
        position: relative;
      }
      .combo .caret {
        flex: 0 0 auto;
        font-size: 11px;
        line-height: 1;
        color: var(--ink-500);
      }
      .combo-panel {
        position: absolute;
        left: 0;
        right: 0;
        top: calc(100% + var(--space-2));
        z-index: 5;
        overflow: hidden;
        background: var(--bg-surface);
        border: 1px solid var(--line);
        border-radius: var(--radius-md);
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
      }
      .rows {
        list-style: none;
        margin: 0;
        padding: 0;
        max-height: 168px;
        overflow-y: auto;
      }
      .rows li {
        display: flex;
        align-items: center;
        gap: var(--space-5);
        padding: var(--space-4) var(--space-5);
        font-size: var(--fs-sm);
        color: var(--ink-300);
        border-left: 2px solid transparent;
        cursor: pointer;
      }
      .rows li[aria-selected="true"] {
        background: var(--bg-pressed);
        border-left-color: var(--signal);
        color: var(--ink-100);
      }
      .rows li .name {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .rows li mark {
        background: none;
        color: var(--signal);
      }
      .rows .bullets {
        flex: 0 0 auto;
        display: flex;
        gap: 3px;
      }
      .rows li.empty {
        color: var(--ink-600);
        font-size: var(--fs-xs);
        cursor: default;
      }
      .combo-meta {
        display: flex;
        justify-content: space-between;
        padding: var(--space-3) var(--space-5);
        border-top: 1px dashed var(--line-faint);
        font-size: 10px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--ink-600);
      }

      /* --- Foot --- */
      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-5);
        padding: var(--space-5) var(--space-6);
        border-top: 1px solid var(--line);
        min-height: 20px;
      }
      .hint {
        font-size: var(--fs-xxs);
        letter-spacing: var(--tracking-foot);
        text-transform: uppercase;
        color: var(--ink-600);
      }
      .actions {
        display: flex;
        gap: var(--space-4);
        margin-left: auto;
      }
      button.text {
        font-family: var(--font-mono);
        font-size: var(--fs-xxs);
        font-weight: var(--weight-med);
        letter-spacing: 0.18em;
        text-transform: uppercase;
        padding: var(--space-2) var(--space-5);
        appearance: none;
        background: transparent;
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        color: var(--ink-200);
        cursor: pointer;
        transition:
          background var(--motion-base) var(--ease),
          border-color var(--motion-base) var(--ease),
          color var(--motion-base) var(--ease);
      }
      button.text:hover {
        background: var(--bg-elevated);
        border-color: var(--ink-600);
        color: var(--ink-100);
      }
      button.text.primary {
        background: var(--ink-100);
        border-color: var(--ink-100);
        color: var(--bg-stage);
      }
      button.text.primary:hover {
        background: #fff;
        border-color: #fff;
      }
      button.text.ghost {
        border-color: transparent;
        color: var(--ink-soft);
      }
      button.text.ghost:hover {
        background: transparent;
        color: var(--ink-200);
      }

      /* Status word: dot + tracked caps. The only decorated chip. */
      .status {
        display: none;
      }
      .status.on {
        display: inline-flex;
        align-items: center;
        gap: var(--space-3);
        font-size: var(--fs-xxs);
        letter-spacing: var(--tracking-caps);
        text-transform: uppercase;
      }
      .status.on::before {
        content: "";
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: currentColor;
        box-shadow: 0 0 6px currentColor;
      }
      .status.warn {
        color: var(--signal-warn);
      }
      .status.danger {
        color: var(--signal-danger);
      }

      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="trip" id="trip">Train<span class="sep">·</span>Menu</div>
      <div class="controls">
        <button class="icon" id="doRefresh" title="Refresh">
          <!-- Lucide RotateCw -->
          <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36" /><path d="M21 3v6h-6" /></svg>
        </button>
        <button class="icon" id="doSettings" title="Settings">
          <!-- Lucide Settings, inlined verbatim - no icon dependency. -->
          <svg viewBox="0 0 24 24">
            <path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </button>
        <button class="icon" id="doQuit" title="Quit">
          <!-- Lucide Power -->
          <svg viewBox="0 0 24 24"><path d="M18.36 6.64a9 9 0 1 1-12.73 0" /><path d="M12 2v10" /></svg>
        </button>
      </div>
    </header>

    <main>
      <!-- Departures -->
      <section id="board" hidden>
        <!-- The departures that reach your destination in the near term, live rows
             and timetable rows in one list, soonest first. There is no hero above
             it: the list already answers every question one did, and the trip it is
             for is named in the header. -->
        <div class="feed" id="feed">
          <div class="feedhead">
            <span class="live" id="feedLive"></span>
            <span id="feedCount"></span>
            <span class="stamp" id="feedStamp"></span>
          </div>
          <table class="feedtable">
            <tbody id="feedRows"></tbody>
          </table>
          <div class="feedfoot">
            <span id="feedMine"></span>
          </div>
        </div>

        <!-- Alerts, filtered to the lines that carry the trip. Absent, not
             empty, until a check has actually landed. -->
        <div id="alerts" hidden>
          <div class="watch">
            <span>watching</span>
            <span class="chips" id="watchChips"></span>
            <span class="when" id="watchWhen"></span>
          </div>
          <div id="alertList"></div>
        </div>
      </section>

      <!-- Setup -->
      <section id="setup" hidden>
        <h1>train menu</h1>
        <div class="lede" id="lede">tell train menu where you travel</div>
        <form id="form">
          <label>
            <div class="label">From</div>
            <div class="combo">
              <div class="field">
                <span class="prompt">&rsaquo;</span
                ><input
                  id="from"
                  autocomplete="off"
                  placeholder="boarding station"
                  role="combobox"
                  aria-expanded="false"
                  aria-controls="fromRows"
                  aria-autocomplete="list"
                /><span class="caret">&#9662;</span>
              </div>
              <div class="combo-panel" id="fromPanel" hidden>
                <ul class="rows" id="fromRows" role="listbox" aria-label="stations"></ul>
                <div class="combo-meta"><span id="fromCount"></span><span>&#8593;&#8595; enter</span></div>
              </div>
            </div>
          </label>
          <label>
            <div class="label">To</div>
            <div class="combo">
              <div class="field">
                <span class="prompt">&rsaquo;</span
                ><input
                  id="to"
                  autocomplete="off"
                  placeholder="destination station"
                  role="combobox"
                  aria-expanded="false"
                  aria-controls="toRows"
                  aria-autocomplete="list"
                /><span class="caret">&#9662;</span>
              </div>
              <div class="combo-panel" id="toPanel" hidden>
                <ul class="rows" id="toRows" role="listbox" aria-label="stations"></ul>
                <div class="combo-meta"><span id="toCount"></span><span>&#8593;&#8595; enter</span></div>
              </div>
            </div>
          </label>
          <label>
            <div class="label">WMATA API key</div>
            <div class="field">
              <span class="prompt">&rsaquo;</span><input id="apiKey" type="password" placeholder="developer key" />
            </div>
          </label>
          <div id="advanced" hidden>
            <label>
              <div class="label">Menu bar</div>
              <div class="styles" id="styles" role="radiogroup" aria-label="menu bar style"></div>
            </label>
            <label>
              <div class="label">Walk to platform</div>
              <div class="field">
                <span class="prompt">&rsaquo;</span
                ><input id="walkMin" type="number" min="0" max="60" step="1" inputmode="numeric" placeholder="0" /><span
                  class="unit"
                  >min</span
                >
              </div>
              <div class="sublabel">0 turns the walk off</div>
            </label>
            <label>
              <div class="label">Brightness</div>
              <div class="field range">
                <input id="brightness" type="range" min="0" max="100" step="5" aria-label="brightness" />
                <span class="unit" id="brightnessOut"></span>
              </div>
            </label>
            <label>
              <div class="label">Text size</div>
              <div class="field range">
                <input id="textPx" type="range" min="12" max="16" step="1" aria-label="text size" />
                <span class="unit" id="textPxOut"></span>
              </div>
              <div class="sublabel">14 is standard · two either side</div>
            </label>
            <label>
              <div class="label">Opacity</div>
              <div class="field range">
                <input id="opacity" type="range" min="0" max="100" step="5" aria-label="opacity" />
                <span class="unit" id="opacityOut"></span>
              </div>
              <div class="sublabel">100 turns the see-through off</div>
            </label>
          </div>
        </form>
      </section>
    </main>

    <footer>
      <div class="status" id="status"></div>
      <div class="hint" id="hint"></div>
      <div class="actions" id="actions"></div>
    </footer>

    <script>
      const el = (id) => document.getElementById(id);
      const board = el("board");
      const setup = el("setup");
      const form = el("form");
      const status = el("status");
      const hint = el("hint");
      const actions = el("actions");

      const LABELS = { from: "boarding station", to: "destination", apiKey: "api key" };

      // The menu bar readout styles, in the order they were designed. The ids must
      // match TRAY_STYLES in ../main/tray-image.js - the renderer is a plain
      // script with no bundler, so it cannot import them.
      const STYLES = [
        ["dot", "dot", "line colour, plain digits"],
        ["pixel", "pixel", "digits as a departure board"],
        ["flash", "flash", "inverts under 5 min"],
      ];
      // Chosen in the form and saved with it, so picking a style does not commit a
      // half-typed station.
      let pickedStyle = "dot";

      // --- Brightness ---
      // One number lifts the dim end of the ink scale toward white. A single
      // exponent beats a table of exceptions: at 100 the minute column goes 96% ->
      // 98% (invisible) while the faintest text goes 22% -> 50%, and the order of
      // the steps holds at every setting, so no position can flatten the board's
      // hierarchy. Only these six TEXT steps move - dividers, hairlines, the mint
      // signal and the alert tint are not on this scale.
      //
      // The base alphas must match the six --ink-N steps in tokens.css: this is a
      // plain script with no bundler, so it cannot read them from source.
      // All three keep in step with ../main/config.js - a plain script with no
      // bundler cannot import them.
      const DEFAULT_BRIGHTNESS = 50;
      const DEFAULT_TEXT_PX = 14;
      const DEFAULT_OPACITY = 90;
      const INK_STEPS = [
        ["ink-100", 0.96],
        ["ink-200", 0.86],
        ["ink-300", 0.65],
        ["ink-400", 0.48],
        ["ink-500", 0.34],
        ["ink-600", 0.22],
      ];

      function applyBrightness(value) {
        const lift = Math.min(Math.max(Number(value) || 0, 0), 100);
        const gamma = 1 + (lift / 100) * 1.2;
        for (const [token, alpha] of INK_STEPS) {
          const lifted = alpha ** (1 / gamma);
          document.documentElement.style.setProperty(`--${token}`, `rgba(255, 255, 255, ${lifted.toFixed(3)})`);
        }
      }

      // The other two knobs. One declaration each: every size on the surface is a
      // rem off the root, and the ground is the only thing carrying an alpha.
      function applyTextPx(value) {
        const px = Math.min(Math.max(Math.round(Number(value) || 0) || DEFAULT_TEXT_PX, 12), 16);
        document.documentElement.style.setProperty("--text-px", px);
      }

      function applyOpacity(value) {
        const pct = Math.min(Math.max(Number(value) || 0, 0), 100);
        document.documentElement.style.setProperty("--pop-alpha", (pct / 100).toFixed(2));
      }

      // Live while dragging, so the board behind the form is the preview. The fill
      // is the mint run of track to the left of the thumb, in the slider's own
      // units - a range that does not start at 0 would otherwise fill from 0.
      function paintRange(id, out, apply, suffix = "") {
        const slider = el(id);
        const span = Number(slider.max) - Number(slider.min);
        const pct = span ? ((Number(slider.value) - Number(slider.min)) / span) * 100 : 0;
        slider.style.setProperty("--fill", `${pct}%`);
        el(out).textContent = `${slider.value}${suffix}`;
        apply(slider.value);
      }

      const paintBrightness = () => paintRange("brightness", "brightnessOut", applyBrightness);
      const paintTextPx = () => paintRange("textPx", "textPxOut", applyTextPx, "pt");
      const paintOpacity = () => paintRange("opacity", "opacityOut", applyOpacity, "%");

      function renderStyles() {
        el("styles").replaceChildren(
          ...STYLES.map(([id, name, note]) => {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "style";
            button.role = "radio";
            button.dataset.style = id;
            button.setAttribute("aria-checked", String(id === pickedStyle));
            const label = document.createElement("span");
            label.className = "name";
            label.textContent = name;
            const hint = document.createElement("span");
            hint.className = "note";
            hint.textContent = note;
            button.append(label, hint);
            button.addEventListener("click", () => {
              pickedStyle = id;
              renderStyles();
            });
            return button;
          }),
        );
      }

      // Bundled with the app, so the picker is populated before any key exists.
      let stations = [];
      window.trainMenu.getStations().then((list) => {
        stations = list;
        for (const combo of combos) combo.refresh();
      });

      // The station list carries line codes; the dots want colour names. parse.js
      // owns the same mapping, but the renderer is a plain script with no bundler,
      // so it cannot import it.
      const LINE_COLOR = { RD: "red", OR: "orange", BL: "blue", GR: "green", YL: "yellow", SV: "silver" };

      const findStation = (value) => stations.find((s) => s.name.toLowerCase() === value.trim().toLowerCase());

      // A station row: the name with the typed run marked, and one dot per line
      // the station serves. Built as nodes, never as HTML - the query is typed by
      // the user and this runs in the renderer.
      function stationRow(station, query) {
        const li = document.createElement("li");
        li.setAttribute("role", "option");
        const name = document.createElement("span");
        name.className = "name";
        const at = query ? station.name.toLowerCase().indexOf(query) : -1;
        if (at < 0) {
          name.textContent = station.name;
        } else {
          const hit = document.createElement("mark");
          hit.textContent = station.name.slice(at, at + query.length);
          name.append(station.name.slice(0, at), hit, station.name.slice(at + query.length));
        }
        const bullets = document.createElement("span");
        bullets.className = "bullets";
        for (const code of station.lines ?? []) {
          const dot = document.createElement("span");
          dot.className = "dot";
          if (LINE_COLOR[code]) dot.dataset.color = LINE_COLOR[code];
          bullets.append(dot);
        }
        li.append(name, bullets);
        return li;
      }

      /**
       * One station listbox. Opens on click, typing or ArrowDown - deliberately
       * not on focus, so arriving in Settings does not drop a panel over the form.
       */
      function combobox(id) {
        const input = el(id);
        const panel = el(`${id}Panel`);
        const rows = el(`${id}Rows`);
        const count = el(`${id}Count`);
        let matches = [];
        let active = 0;

        const isOpen = () => !panel.hidden;

        function paint() {
          const query = input.value.trim().toLowerCase();
          // Earliest match first, so "ross" offers Rosslyn before Hyattsville
          // Crossing. The list arrives alphabetical and the sort is stable, so
          // equal-rank stations keep that order.
          matches = stations
            .map((station) => ({ station, at: station.name.toLowerCase().indexOf(query) }))
            .filter((hit) => hit.at >= 0)
            .sort((a, b) => a.at - b.at)
            .map((hit) => hit.station);
          active = Math.max(0, Math.min(active, matches.length - 1));
          count.textContent = stations.length ? `${matches.length} of ${stations.length}` : "";
          if (!matches.length) {
            const li = document.createElement("li");
            li.className = "empty";
            li.textContent = stations.length
              ? `no station matches "${input.value.trim()}"`
              : "station list unavailable - type the name";
            rows.replaceChildren(li);
            return;
          }
          rows.replaceChildren(
            ...matches.map((station, i) => {
              const li = stationRow(station, query);
              li.setAttribute("aria-selected", String(i === active));
              // mousedown, not click: the input's blur would close the panel first.
              li.addEventListener("mousedown", (event) => {
                event.preventDefault();
                choose(i);
              });
              return li;
            }),
          );
          rows.children[active]?.scrollIntoView({ block: "nearest" });
        }

        function open() {
          if (isOpen()) return;
          panel.hidden = false;
          input.setAttribute("aria-expanded", "true");
          active = 0;
          paint();
          reportHeight();
        }

        function close() {
          if (!isOpen()) return;
          panel.hidden = true;
          input.setAttribute("aria-expanded", "false");
          reportHeight();
        }

        function choose(i) {
          const station = matches[i];
          if (!station) return;
          input.value = station.name;
          setStatus("", "");
          close();
        }

        input.addEventListener("click", open);
        input.addEventListener("blur", close);
        input.addEventListener("input", () => (isOpen() ? paint() : open()));
        input.addEventListener("keydown", (event) => {
          if (event.key === "ArrowDown" || event.key === "ArrowUp") {
            event.preventDefault();
            if (!isOpen()) return open();
            const step = event.key === "ArrowDown" ? 1 : -1;
            active = (active + step + matches.length) % Math.max(1, matches.length);
            paint();
          } else if (event.key === "Enter" && isOpen()) {
            // Choosing a station must not also submit the form.
            event.preventDefault();
            choose(active);
          } else if (event.key === "Escape" && isOpen()) {
            event.preventDefault();
            close();
          } else if (event.key === "Tab") {
            close();
          }
        });

        return { refresh: () => isOpen() && paint(), close };
      }

      const combos = ["from", "to"].map(combobox);

      let state = {
        configured: false,
        config: {},
        title: {},
        note: "",
        platform: [],
        list: { rows: [], window: 30 },
        fetchedAt: 0,
        arriveAt: 0,
        leaveIn: null,
        watching: [],
        alerts: [],
        checkedAt: 0,
        stale: false,
        error: "",
        nextAt: 0,
      };
      let mode = "board"; // "board" | "setup"

      // The window is sized to its content: the renderer measures itself and the
      // main process applies the height. An open combobox panel is out of flow, so
      // the body does not grow with it - without the second term the popover
      // window would clip the station list.
      function reportHeight() {
        const body = document.body.getBoundingClientRect().height;
        const panel = document.querySelector(".combo-panel:not([hidden])");
        const needed = panel ? panel.getBoundingClientRect().bottom + 12 : 0;
        window.trainMenu.resize(Math.ceil(Math.max(body, needed)));
      }
      new ResizeObserver(reportHeight).observe(document.body);

      function setStatus(text, kind) {
        status.className = text ? `status on ${kind}` : "status";
        status.textContent = text;
      }

      // The deadline comes from the main process, which owns the timer; the second
      // hand is drawn locally so no IPC is needed once a second.
      function tickCountdown() {
        if (mode !== "board") return;
        if (state.error) {
          hint.textContent = state.error;
          return;
        }
        const left = Math.max(0, Math.ceil((state.nextAt - Date.now()) / 1000));
        hint.textContent = state.nextAt ? `updating in ${left}s` : "";
      }
      setInterval(tickCountdown, 1000);

      // 24-hour, tabular, no seconds unless asked: these are clock readings, and
      // the wall-clock stamp is the freshness proof for the whole board.
      const clock = (ms, seconds) =>
        new Date(ms).toLocaleTimeString("en-GB", {
          hour: "2-digit",
          minute: "2-digit",
          ...(seconds ? { second: "2-digit" } : {}),
        });

      const node = (tag, className, text) => {
        const element = document.createElement(tag);
        if (className) element.className = className;
        if (text !== undefined) element.textContent = text;
        return element;
      };

      // The minute column carries its own unit as a smaller glyph, so the wait is
      // split rather than trimmed: "~23m" -> ["~23", "m"]. BRD, ARR and "--" have
      // no unit to split off and pass through whole.
      const splitMin = (wait) => (wait.endsWith("m") ? [wait.slice(0, -1), "m"] : [wait, ""]);

      // A line's name is its colour, so the alert card needs no second table.
      const lineName = (code) => {
        const color = LINE_COLOR[code];
        return color ? color[0].toUpperCase() + color.slice(1) : code;
      };

      // "leave in 1m", and at zero the word rather than "0m".
      const leaveLabel = () => (state.leaveIn === 0 ? "leave now" : `leave in ${state.leaveIn}m`);

      // The wall-clock time a train leaves: its minute against the stamp the feed
      // was read at, never against the local clock, so the whole board ages as one
      // reading rather than drifting a minute apart from its own timestamp.
      const departsAt = (train) =>
        state.fetchedAt && Number.isFinite(train.eta) ? clock(state.fetchedAt + train.eta * 60_000) : "";

      // The verdict line under a row: the whole of what the hero used to say, on the
      // one train it was ever about, so the two cannot be read apart or drift apart.
      // Mint for the train you are being sent for, one step dark for the one the
      // walk has already taken - "gone" is not a signal, it is a regret.
      function answerRow(train) {
        if (!(state.config.walkMin > 0)) return null;
        const row = node("tr", train.target ? "answer" : "answer past");
        const cell = document.createElement("td");
        cell.colSpan = 4;
        if (train.target) {
          cell.append(leaveLabel());
          // The arrival is a scheduled average, so it keeps its tilde here exactly
          // as it did in the hero.
          if (state.arriveAt) cell.append(node("span", "tail", ` · arrive ~${clock(state.arriveAt)}`));
        } else {
          cell.append("gone");
          // How far short, because dim ink alone does not say why a 3-minute train
          // is out of reach when the walk is 5.
          const short = state.config.walkMin - train.eta;
          if (Number.isFinite(short) && short > 0) cell.append(node("span", "tail", ` · ${short} min short`));
        }
        // The empty first cell keeps the line under the terminus rather than under
        // the minute, so it reads as belonging to the train and not to the column.
        row.append(document.createElement("td"), cell);
        return row;
      }

      // The header names the trip, or the app when there is no trip yet - the setup
      // form is the one screen where the app's own name is the only thing to say.
      function renderTrip() {
        const { from, to } = state.config;
        const trip = el("trip");
        if (from && to) {
          trip.replaceChildren(from, node("span", "sep", " → "), to);
        } else {
          trip.replaceChildren("Train", node("span", "sep", "·"), "Menu");
        }
      }

      function renderFeed() {
        const { rows: trains } = state.list;
        // No window claim: a row kept past the horizon - the last train of the
        // night - would make one a lie, and the stamp already dates the board.
        el("feedCount").textContent = "Departures";
        // The live pip is a claim that the platform sign is speaking. On a board
        // carrying nothing but timetable rows it would be claiming too much.
        el("feedLive").hidden = !trains.some((train) => train.source !== "sched");
        el("feedStamp").textContent = state.fetchedAt ? clock(state.fetchedAt, true) : "";

        const rows = [];
        for (const train of trains) {
          // "gone" and "leave in" are decided in the main process, on the one list
          // all three surfaces read - the row never re-derives them.
          const verdict = state.config.walkMin > 0 && (train.target || train.missed);
          const kind = train.target ? "go" : train.missed ? "missed" : train.mine ? "" : "other";
          const row = node("tr", `${kind}${train.source === "sched" ? " sched" : ""}${verdict ? " said" : ""}`.trim());
          const [value, unit] = splitMin(train.wait);
          const min = node("td", "c-min", value);
          if (unit) min.append(node("span", "u", unit));
          const dot = node("td", "c-dot");
          const bullet = node("span", "dot");
          if (LINE_COLOR[train.line]) bullet.dataset.color = LINE_COLOR[train.line];
          dot.append(bullet);
          // One column, one meaning, every row: when this train leaves.
          row.append(
            min,
            dot,
            node("td", "c-ln", train.line),
            node("td", "c-to", train.terminus),
            node("td", "c-clock", departsAt(train)),
          );
          rows.push(row);
          if (verdict) rows.push(answerRow(train));
        }
        // A quiet platform is honest but it looks broken, so the reason goes in the
        // list rather than leaving an empty box to be interpreted.
        if (!rows.length) {
          const quiet = node("tr", "quiet");
          const cell = node("td", "", state.note || (state.error ? "no departures - the feed did not answer" : "no departures"));
          cell.colSpan = 5;
          quiet.append(cell);
          rows.push(quiet);
        }
        el("feedRows").replaceChildren(...rows);

        // The walk, named once, under the trains it applies to. With no walk set
        // there is nothing to name, so the line falls back to what the list holds.
        const mine = trains.filter((train) => train.mine).length;
        const to = state.config.to ?? "your stop";
        el("feedMine").textContent =
          state.config.walkMin > 0
            ? `${state.config.walkMin} min walk to ${to}`
            : mine
              ? `${mine} to ${to}`
              : "none to your stop";
      }

      function renderAlerts() {
        // Absent, not empty: until a check has landed there is nothing to report,
        // and a bare "watching" row would claim a clear feed we have not read.
        el("alerts").hidden = !state.checkedAt;
        if (!state.checkedAt) return;
        el("watchChips").replaceChildren(...state.watching.map((code) => node("span", "chip", code)));
        el("watchWhen").textContent = clock(state.checkedAt);

        if (!state.alerts.length) {
          const clear = node("div", "clear");
          clear.append(
            node("span", "ok", "✓"),
            node("span", "", "No active alerts on your lines"),
            node("span", "when", `checked ${clock(state.checkedAt)}`),
          );
          el("alertList").replaceChildren(clear);
          return;
        }
        el("alertList").replaceChildren(
          ...state.alerts.map((alert) => {
            const card = node("div", "alert");
            const top = node("div", "top");
            top.append(
              node("span", "adot"),
              node("span", "", `${alert.lines.map(lineName).join("/")} · ${alert.type}`),
              node("span", "age", alert.age ? `updated ${alert.age}` : ""),
            );
            const body = node("div", "body", alert.description);
            // Descriptions run past 300 characters, so the clamp needs a way out
            // rather than cutting mid-fact.
            const more = node("span", "more", "Read all");
            more.addEventListener("click", () => {
              const open = card.classList.toggle("open");
              more.textContent = open ? "Show less" : "Read all";
            });
            card.append(top, body, more);
            return card;
          }),
        );
      }

      function renderBoard() {
        board.hidden = false;
        setup.hidden = true;
        // Also the revert path: leaving Settings without saving drops the live
        // preview back to whatever is actually on disk.
        applyBrightness(state.config.brightness ?? DEFAULT_BRIGHTNESS);
        applyTextPx(state.config.textPx ?? DEFAULT_TEXT_PX);
        applyOpacity(state.config.opacity ?? DEFAULT_OPACITY);
        renderTrip();
        renderFeed();
        renderAlerts();
        setStatus(state.stale ? "stale" : "", "warn");
        tickCountdown();
        actions.replaceChildren();
      }

      function renderSetup() {
        board.hidden = true;
        setup.hidden = false;
        el("advanced").hidden = !state.configured;
        el("lede").textContent = state.configured
          ? "change where train menu looks"
          : "tell train menu where you travel, and how to reach wmata";
        el("from").value = state.config.from ?? "";
        el("to").value = state.config.to ?? "";
        el("apiKey").value = state.config.apiKey ?? "";
        pickedStyle = state.config.style ?? "dot";
        renderStyles();
        el("walkMin").value = state.config.walkMin ?? 0;
        el("brightness").value = state.config.brightness ?? DEFAULT_BRIGHTNESS;
        el("textPx").value = state.config.textPx ?? DEFAULT_TEXT_PX;
        el("opacity").value = state.config.opacity ?? DEFAULT_OPACITY;
        paintBrightness();
        paintTextPx();
        paintOpacity();
        setStatus("", "");
        hint.textContent = "";

        const save = document.createElement("button");
        save.className = "text primary";
        save.textContent = "Save";
        save.addEventListener("click", submit);
        actions.replaceChildren();
        if (state.configured) {
          const cancel = document.createElement("button");
          cancel.className = "text ghost";
          cancel.textContent = "Cancel";
          cancel.addEventListener("click", () => show("board"));
          actions.append(cancel);
        }
        actions.append(save);
        el("from").focus();
      }

      function show(next) {
        mode = next;
        for (const combo of combos) combo.close();
        if (mode === "setup") renderSetup();
        else renderBoard();
      }

      async function submit() {
        // All three are needed before a fetch can succeed, so refuse early rather
        // than saving a config that can only produce an error on the board.
        const missing = ["from", "to", "apiKey"].filter((id) => !el(id).value.trim());
        if (missing.length) {
          setStatus(missing.length > 1 ? "stations and key required" : `${LABELS[missing[0]]} required`, "danger");
          return;
        }
        // A typo here only surfaces later as a failed refresh, so catch it while
        // the user is still looking at the field. Skipped if the list is empty.
        const typo = stations.length && ["from", "to"].find((id) => !findStation(el(id).value));
        if (typo) {
          setStatus(`unknown ${LABELS[typo]}`, "danger");
          el(typo).focus();
          return;
        }
        setStatus("", "");
        await window.trainMenu.save({
          from: el("from").value,
          to: el("to").value,
          apiKey: el("apiKey").value,
          // No refreshSec: 30s is the only interval now, and normalizeConfig
          // defaults the missing field. Faster than that is the refresh button.
          style: pickedStyle,
          // A blank field is 0, which is the off value - normalizeConfig clamps
          // the rest, so a pasted "999" cannot shadow the whole feed.
          walkMin: Number(el("walkMin").value),
          brightness: Number(el("brightness").value),
          textPx: Number(el("textPx").value),
          opacity: Number(el("opacity").value),
        });
        show("board");
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        submit();
      });

      el("brightness").addEventListener("input", paintBrightness);
      el("textPx").addEventListener("input", paintTextPx);
      el("opacity").addEventListener("input", paintOpacity);

      el("doRefresh").addEventListener("click", () => window.trainMenu.refresh());
      el("doSettings").addEventListener("click", () => show(mode === "setup" ? "board" : "setup"));
      el("doQuit").addEventListener("click", () => window.trainMenu.quit());

      function apply(next) {
        state = next;
        // A state push must never re-render the setup form: renderSetup() rewrites
        // every field and refocuses #from, so a refresh landing mid-typing reverted
        // the (masked) api key and sent the rest of it to the boarding station.
        // The form is drawn only by user action or on first run.
        if (!state.configured && mode !== "setup") show("setup");
        else if (mode === "board") renderBoard();
      }

      window.trainMenu.onState(apply);
      window.trainMenu.getState().then(apply);
    </script>
  </body>
</html>
